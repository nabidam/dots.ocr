version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:v0.13.0
    container_name: vllm-server
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      # HuggingFace cache directory for downloaded models
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Optional local weights directory (mount local weights to /workspace/weights)
      - ./models:/workspace/weights
    command: >
      serve ${MODEL_PATH:-rednote-hilab/dots.mocr}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.9}
      --chat-template-content-format string
      --served-model-name ${SERVED_MODEL_NAME:-model}
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
