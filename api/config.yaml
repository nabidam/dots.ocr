app:
  name: dots-ocr-api
  host: 0.0.0.0
  port: 8088
  log_level: INFO
  max_upload_size_mb: 50
  max_concurrent_inferences: 1
  cors_origins:
    - "*"

vllm:
  protocol: http
  host: localhost
  port: 8000
  model_name: dots.mocr

ocr:
  prompt_mode: prompt_layout_all_en
  temperature: 0.1
  top_p: 0.9
  max_completion_tokens: 16384
  pdf_dpi: 200
  # Response image encoding only; inference always uses the full render.
  image_format: png
  image_quality: 85
  image_max_dimension: null

logging:
  file: logs/dots-ocr-api.log
  max_bytes: 10485760
  backup_count: 5
